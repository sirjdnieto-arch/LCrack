# .github/workflows/deploy.yml

name: Deploy LCrack Dashboard

# ══════════════════════════════════════════════════════════════
# FIX 1 — Concurrencia: cancela runs anteriores del mismo grupo
# Evita que dos pushes simultáneos colisionen en gh-pages
# ══════════════════════════════════════════════════════════════
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 8 * * 1-5'   # lunes-viernes 08:00 UTC
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance ta matplotlib pandas numpy

      - name: Generate site
        run: python main.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          # ══════════════════════════════════════════════════
          # FIX 2 — force_orphan: reescribe gh-pages completo
          # en vez de hacer merge/fast-forward — elimina el
          # conflicto de historia divergente para siempre
          # ══════════════════════════════════════════════════
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.run_id }}'
